<style>

html,
body{
    height:100%;
    margin:0;
}

body{
    background:#f5f5f5;
}

.main-screen{

    height:100vh;

    padding:12px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

.card-area{

    flex:1 1 0;
    min-height:0;
    border-radius:24px;
    overflow:hidden;
   
}
.card-body{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
 }

.card-area img{

    max-width:100%;
    max-height:100%;

    object-fit:contain;
}
 #splash{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:white;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    z-index:99999;

}

#splash img{

    width:120px;
    height:120px;

}

#splash h2{

    margin-top:15px;

    color:#1976d2;

} 
  
.nav-btn{
    width:60px;
    height:60px;
    border-radius:50%;
    font-size:28px;
}
 #prevBtn,
 #nextBtn{
     flex:1;
     width:100px;
     height:70px;
     font-size:32px;
     background:#FFD54F;
     border-radius:20px;
}  
.nav-panel{
    display:flex;
    width:100%;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
} 
 #prevBtn{
     border-right:4px solid #e0b000;
 }

 </div>

let current =
Number(localStorage.getItem("currentCard")) || 0;

let audio = null;
let playing = false;

const letterImage =
document.getElementById("letterImage");

const iconImage =
document.getElementById("iconImage");

const nextBtn =
document.getElementById("nextBtn");
const prevBtn =
document.getElementById("prevBtn");

function loadCard(){

    const card = cards[current];

    letterImage.src = card.letterImage;
    iconImage.src = card.image;

   // nextBtn.classList.remove("show");

    stopAllAudio();
}

function saveProgress(){

    localStorage.setItem(
        "currentCard",
        current
    );
}

function stopAllAudio(){

    speechSynthesis.cancel();

    if(audio){

        audio.pause();
        audio.currentTime = 0;
        audio = null;

    }

    playing = false;
}


 function nextCard(){

    current++;

    if(current >= cards.length){

        current = 0;

    }

    saveProgress();

    loadCard();

}

function prevCard(){

    current--;

    if(current < 0){

        current = cards.length - 1;

    }

    saveProgress();

    loadCard();

}   
function speakText(text){

    return new Promise(resolve=>{

        const utter =
        new SpeechSynthesisUtterance(text);

        utter.lang = "en-US";
        utter.rate = 0.8;

        const voices =
        speechSynthesis.getVoices();

        const englishVoice =

            voices.find(v =>
                v.name === "Samantha"
            )

            ||

            voices.find(v =>
                v.name === "Daniel"
            )

            ||

            voices.find(v =>
                v.lang.includes("en")
            );

        if(englishVoice){

            utter.voice =
            englishVoice;

        }

        utter.onend = ()=>
            resolve();

        speechSynthesis.speak(
            utter
        );

    });

}

function speakFallback(card){
  return new Promise(resolve=>{
    const sound1 =
        new SpeechSynthesisUtterance(card.phonics);

    sound1.lang = "en-US";

    sound1.onend = ()=>{

        setTimeout(()=>{

            const sound2 =
                new SpeechSynthesisUtterance(card.phonics);

            sound2.lang = "en-US";

            sound2.onend = ()=>{

                setTimeout(()=>{

                    const word =
                        new SpeechSynthesisUtterance(card.word);

                    word.lang = "en-US";
                    word.onend = ()=>{
                        resolve();
                   };
                    speechSynthesis.speak(word);

                },800);

            };

            speechSynthesis.speak(sound2);

        },400);

    };

    speechSynthesis.speak(sound1);
 });
}

async function playFallback(card){

    await speakFallback(card);

    showNextButton();

    playing = false;
}
function playWav(file){

    return new Promise((resolve,reject)=>{
       
        audio = new Audio(file);

        audio.onended = ()=>resolve();

        audio.onerror = ()=>reject();

        audio.play().catch(reject);

    });

}    
async function playCard(){
document.addEventListener(
    "pointerup",
    ()=>{
        const u =
            new SpeechSynthesisUtterance("");

        speechSynthesis.speak(u);

    },
    { once:true }
);


    if(playing) return;

    playing = true;

    stopAllAudio();

    const card = cards[current];

    try{
         
        if(card.phonics){

            await playWav(card.phonics);

          await new Promise(resolve =>
                setTimeout(resolve, 100)
            );  

            await playWav(card.phonics);

        }
          if(card.word){

              await speakText(card.word);

        }
       

    }catch(err){

        console.log(err);

    }

   // showNextButton();

    playing = false;

}
