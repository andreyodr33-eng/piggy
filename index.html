<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
<title>notebook</title>
<link rel="manifest" href="manifest.json" />      
content="width=device-width,initial-scale=1">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

html,
body{
    height:100%;
    margin:0;
}

body{
    background:#f5f5f5;
}

.main-screen{

    height:100vh;

    padding:12px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

.card-area{

    flex:1 1 0;
    min-height:0;
    border-radius:24px;
    overflow:hidden;
   
}
.card-body{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
 }

.card-area img{

    max-width:100%;
    max-height:100%;

    object-fit:contain;
}

.next-btn.show{
    display:block;
    animation:fadeIn .3s ease;
}
.next-btn{

    position:absolute;

    right:20px;
    bottom:20px;

    width:90px;
    height:90px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.95);

    box-shadow:
        0 3px 12px rgba(0,0,0,.25);

    font-size:42px;

    display:none;

    z-index:10;
}


</style>

</head>
<body>

<div class="main-screen">

    <div class="card shadow card-area">

        <div class="card-body
                    d-flex
                    align-items-center
                    justify-content-center">

            <img id="letterImage">

        </div>

    </div>

    <div class="card shadow card-area position-relative">

        <div class="card-body
                    d-flex
                    align-items-center
                    justify-content-center">

            <img id="iconImage">

        </div>

        <button
            id="nextBtn"
            class="btn btn-primary next-btn">

            ▶

        </button>

    </div>

</div>
<script>

const cards = [

{
    letterImage:"letters/A.png",
    image:"icons/icon-A.png",
    sound:"sounds/A.wav",

    phonics:"æ",
    word: "apple"

   
},

{
    letterImage:"letters/B.png",
    image:"icons/icon-B.png",
    sound:"sounds/B.wav",

    phonics:"b",
    word: "banana"
}

];

let current =
Number(localStorage.getItem("currentCard")) || 0;

let audio = null;
let playing = false;

const letterImage =
document.getElementById("letterImage");

const iconImage =
document.getElementById("iconImage");

const nextBtn =
document.getElementById("nextBtn");

function loadCard(){

    const card = cards[current];

    letterImage.src = card.letterImage;
    iconImage.src = card.image;

    nextBtn.classList.remove("show");

    stopAllAudio();
}

function saveProgress(){

    localStorage.setItem(
        "currentCard",
        current
    );
}

function stopAllAudio(){

    speechSynthesis.cancel();

    if(audio){

        audio.pause();
        audio.currentTime = 0;
        audio = null;

    }

    playing = false;
}

function showNextButton(){

    nextBtn.classList.add("show");
}

function speakText(text){

    return new Promise(resolve=>{

        const utter =
        new SpeechSynthesisUtterance(text);

        utter.lang = "en-GB";
        utter.rate = 0.8;

        utter.onend = ()=>resolve();

        speechSynthesis.speak(utter);

    });

}
function speakFallback(card){
  return new Promise(resolve=>{
    const sound1 =
        new SpeechSynthesisUtterance(card.phonics);

    sound1.lang = "en-GB";

    sound1.onend = ()=>{

        setTimeout(()=>{

            const sound2 =
                new SpeechSynthesisUtterance(card.phonics);

            sound2.lang = "en-GB";

            sound2.onend = ()=>{

                setTimeout(()=>{

                    const word =
                        new SpeechSynthesisUtterance(card.word);

                    word.lang = "en-GB";
                    word.onend = ()=>{
                        resolve();
                   };
                    speechSynthesis.speak(word);

                },800);

            };

            speechSynthesis.speak(sound2);

        },400);

    };

    speechSynthesis.speak(sound1);
 });
}

async function playFallback(card){

    await speakFallback(card);

    showNextButton();

    playing = false;
}

function playWav(card){

    return new Promise((resolve,reject)=>{

        audio = new Audio(card.sound);

        audio.onended = ()=>resolve();

        audio.onerror = ()=>reject();

        audio.play().catch(reject);

    });

}

async function playCard(){

    if(playing) return;

    playing = true;

    stopAllAudio();

    const card = cards[current];

    try{

        await playWav(card);

        showNextButton();

        playing = false;

    }catch(err){

        await playFallback(card);

    }

}

document.body.addEventListener("click",(e)=>{

    if(e.target === nextBtn)
        return;

    playCard();

});

nextBtn.addEventListener("click",(e)=>{

    e.stopPropagation();

    current++;

    if(current >= cards.length){

        current = 0;

    }

    saveProgress();

    loadCard();

});

loadCard();

</script>


</body>
</html>
