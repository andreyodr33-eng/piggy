<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">    
<title>English Sounds & Words</title>
<link rel="manifest" href="manifest.json" />      
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

html,
body{
    height:100%;
    margin:0;
}

body{
    background:#f5f5f5;
}

.main-screen{

    height:100vh;

    padding:12px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

.card-area{

    flex:1 1 0;
    min-height:0;
    border-radius:24px;
    overflow:hidden;
   
}
.card-body{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
 }

.card-area img{

    max-width:100%;
    max-height:100%;

    object-fit:contain;
}

.next-btn.show{
    display:block;
    animation:fadeIn .3s ease;
}
.next-btn{

    position:absolute;

    right:20px;
    bottom:20px;

    width:90px;
    height:90px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.95);

    box-shadow:
        0 3px 12px rgba(0,0,0,.25);

    font-size:42px;

    display:none;

    z-index:10;
}
.next-btn{

    border:none;
    background:none;
    padding:0;

}

.next-btn img{

    width:80px;
    height:80px;

}
 #splash{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:white;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    z-index:99999;

}

#splash img{

    width:120px;
    height:120px;

}

#splash h2{

    margin-top:15px;

    color:#1976d2;

} 
   

</style>

</head>
<body>
<div id="splash">

    <img
        src="icons/icon-192.png"
        alt="Logo">

    <h2>
     English Sounds & Words
    </h2>

</div>

                    d-flex
                    align-items-center
                    justify-content-center">

    <div class="card shadow card-area position-relative">

                    d-flex
                    align-items-center
                    justify-content-center">

            <img id="iconImage">

     </div>
        <button id="nextBtn" class="next-btn">

        <img src="icons/next.png">

        </button>

         </div>
  </div>
<script>

const cards = [

},

     word: "cat"
},

     word: "dog"
},
{

},

},
{    
 letterImage:"letters/J.png",

    // phonics:"sounds/J.wav",
  word: "juice"
},
{
 letterImage:"letters/K.png",
    image:"icons/icon-K.png",
    // phonics:"sounds/K.wav",
   word: "kite"
}, 
{
 letterImage:"letters/L.png",
    image:"icons/icon-L.png",
    // phonics:"sounds/L.wav",
    word: "lion"
},
{
 letterImage:"letters/M.png",
    image:"icons/icon-M.png",
    // phonics:"sounds/M.wav",
   word: "monkey"
},        
{
    letterImage:"letters/N.png",

    word: "nest"
},
{

},
{

    // phonics:"sounds/P.wav",
    word: "penguin"
},              
{
    letterImage:"letters/Q.png",
    image:"icons/icon-Q.png",
    // phonics:"sounds/Q.wav",
    word: "queen"
}              
];

let current =
Number(localStorage.getItem("currentCard")) || 0;

let audio = null;
let playing = false;

const letterImage =
document.getElementById("letterImage");

const iconImage =
document.getElementById("iconImage");

const nextBtn =
document.getElementById("nextBtn");

function loadCard(){

    const card = cards[current];

    letterImage.src = card.letterImage;
    iconImage.src = card.image;

    nextBtn.classList.remove("show");

    stopAllAudio();
}

function saveProgress(){

    localStorage.setItem(
        "currentCard",
        current
    );
}

function stopAllAudio(){

    speechSynthesis.cancel();

    if(audio){

        audio.pause();
        audio.currentTime = 0;
        audio = null;

    }

    playing = false;
}

function showNextButton(){

    nextBtn.classList.add("show");
}
    
function speakText(text){

    return new Promise(resolve=>{

        const utter =
            new SpeechSynthesisUtterance(text);

        utter.lang = "en-US";
        utter.rate = 0.8;

        let finished = false;

        const done = ()=>{

            if(finished) return;

            finished = true;

            resolve();

        };

        utter.onend = done;

        utter.onerror = done;

        speechSynthesis.speak(utter);

        setTimeout(done,3000);

    });

}



        
function speakFallback(card){
  return new Promise(resolve=>{
    const sound1 =
        new SpeechSynthesisUtterance(card.phonics);

    sound1.lang = "en-US";

    sound1.onend = ()=>{

        setTimeout(()=>{

            const sound2 =
                new SpeechSynthesisUtterance(card.phonics);

            sound2.lang = "en-US";

            sound2.onend = ()=>{

                setTimeout(()=>{

                    const word =
                        new SpeechSynthesisUtterance(card.word);

                    word.lang = "en-US";
                    word.onend = ()=>{
                        resolve();
                   };
                    speechSynthesis.speak(word);

                },800);

            };

            speechSynthesis.speak(sound2);

        },400);

    };

    speechSynthesis.speak(sound1);
 });
}

async function playFallback(card){

    await speakFallback(card);

    showNextButton();

    playing = false;
}
function playWav(file){

    return new Promise((resolve,reject)=>{
       // const audio = new Audio(file);
        audio = new Audio(file);

        audio.onended = ()=>resolve();

        audio.onerror = ()=>reject();

        audio.play().catch(reject);

    });

}    
async function playCard(){
   console.log("PLAYCARD");
    if(playing) return;

    playing = true;

    stopAllAudio();

    const card = cards[current];

    if(card.phonics){

       // try{

            await playWav(card.phonics);
            await new Promise(resolve=>setTimeout(resolve,100));
        }
        if(card.word){
            await playWav(card.word);
        }
    }
             speechSynthesis.cancel();
           // await playWav(card.phonics);
            // await speakText(card.word);
            
        catch(err){

            console.log(err);

        }

    }
    
    await speakText(card.word);

    showNextButton();

    playing = false;
}


letterImage.addEventListener(
    "pointerup",
    playCard
);

iconImage.addEventListener(
    "pointerup",
    playCard
);
nextBtn.addEventListener("click",(e)=>{

    current++;

    if(current >= cards.length){

        current = 0;

    }

    saveProgress();

    loadCard();

    
});
loadCard();  
//ЗАСТАВКА    
window.addEventListener(
    "load",
    ()=>{

        setTimeout(
            ()=>{

                document
                    .getElementById(
                        "splash"
                    )
                    .style.display =
                    "none";

            },

            1000

        );

    }
);
     
</script>


</body>
</html>
