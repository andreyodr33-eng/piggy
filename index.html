function loadCard(){

    const card = cards[current];

    letterImage.src = card.letterImage;
    iconImage.src = card.image;



    stopAllAudio();
}

function saveProgress(){

    localStorage.setItem(
        "currentCard",
        current
    );
}
function playPhonic(letter){

    return new Promise(resolve=>{

        const audio =
        new Audio(
            phonics[letter]
        );

        audio.onended =
            ()=>resolve();

        audio.play();

    });

}

function stopAllAudio(){

    speechSynthesis.cancel();

    if(audio){

        audio.pause();
        audio.currentTime = 0;
        audio = null;

    }

    playing = false;
}


 function nextCard(){

    current++;

    if(current >= cards.length){

        current = 0;

    }

    saveProgress();

    loadCard();

}

function prevCard(){

    current--;

    if(current < 0){

        current = cards.length - 1;

    }

    saveProgress();

    loadCard();

}   
function speakText(text){

    return new Promise(resolve=>{

        const utter =
        new SpeechSynthesisUtterance(text);

        utter.lang = "en-US";
        utter.rate = 0.8;

        const voices =
        speechSynthesis.getVoices();

        const englishVoice =

            voices.find(v =>
                v.name === "Samantha"
            )

            ||

            voices.find(v =>
                v.name === "Daniel"
            )

            ||

            voices.find(v =>
                v.lang.includes("en")
            );

        if(englishVoice){

            utter.voice =
            englishVoice;

        }

        utter.onend = ()=>
            resolve();

        speechSynthesis.speak(
            utter
        );

    });

}

function speakFallback(card){
  return new Promise(resolve=>{
    const sound1 =
        new SpeechSynthesisUtterance(card.phonics);

    sound1.lang = "en-US";

    sound1.onend = ()=>{

        setTimeout(()=>{

            const sound2 =
                new SpeechSynthesisUtterance(card.phonics);

            sound2.lang = "en-US";

            sound2.onend = ()=>{

                setTimeout(()=>{

                    const word =
                        new SpeechSynthesisUtterance(card.word);

                    word.lang = "en-US";
                    word.onend = ()=>{
                        resolve();
                   };
                    speechSynthesis.speak(word);

                },800);

            };

            speechSynthesis.speak(sound2);

        },400);

    };

    speechSynthesis.speak(sound1);
 });
}

async function playFallback(card){

    await speakFallback(card);

    showNextButton();

    playing = false;
}
function playWav(file){

    return new Promise((resolve,reject)=>{
       
        audio = new Audio(file);

        audio.onended = ()=>resolve();

        audio.onerror = ()=>reject();

        audio.play().catch(reject);

    });

}    
async function playCard(){
document.addEventListener(
    "pointerup",
    ()=>{
        const u =
            new SpeechSynthesisUtterance("");

        speechSynthesis.speak(u);

    },
    { once:true }
);


    if(playing) return;

    playing = true;

    stopAllAudio();

    const card = cards[current];

     try{
         
        if(card.letter){

            await playPhonic(card.letter);

          await new Promise(resolve =>
                setTimeout(resolve, 100)
            );  

            await playPhonic(card.letter);

        }
          if(card.word){

              await speakText(card.word);

        }

       

    }catch(err){

        console.log(err);

    }

   

    playing = false;

}
